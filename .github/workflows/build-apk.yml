
name: Build NEXUS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q NEXUS_AI_Android_Starter.zip

      - name: Build APK
        run: gradle -p NEXUS_AI_Android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-APK
          path: NEXUS_AI_Android/app/build/outputs/apk/debug/app-debug.apk
